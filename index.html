<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracked Comets</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="alternate" type="application/rss+xml" title="Comet updates" href="comets.xml">
<script>
// Apply a saved theme before the page renders, to avoid a flash of the other theme
try {
  const theme = localStorage.getItem('theme');
  if (theme) document.documentElement.dataset.theme = theme;
} catch (e) {}
</script>
<style>
  /* Kanagawa palette (rebelot/kanagawa.nvim): Lotus for light, Wave for dark */
  :root {
    --bg: #f2ecbc; --surface: #e7dba0; --stripe: #e5ddb0; --border: #dcd5ac;
    --fg: #545464; --muted: #8a8980; --heading: #4d699b; --link: #4d699b;
    --accent: #624c83; --error: #c84053;
    --yellow: #de9800; --orange: #cc6d00; --red: #c84053;
  }
  /* data-theme is set by the toggle; without it the page follows the system setting */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1f1f28; --surface: #2a2a37; --stripe: #252530; --border: #363646;
      --fg: #dcd7ba; --muted: #727169; --heading: #7e9cd8; --link: #7fb4ca;
      --accent: #957fb8; --error: #ff5d62;
      --yellow: #e6c384; --orange: #ffa066; --red: #e46876;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1f1f28; --surface: #2a2a37; --stripe: #252530; --border: #363646;
    --fg: #dcd7ba; --muted: #727169; --heading: #7e9cd8; --link: #7fb4ca;
    --accent: #957fb8; --error: #ff5d62;
    --yellow: #e6c384; --orange: #ffa066; --red: #e46876;
  }
  :root {
    --binoc: color-mix(in srgb, var(--yellow) 22%, var(--bg));
    --nakedeye: color-mix(in srgb, var(--orange) 26%, var(--bg));
    --spectacular: color-mix(in srgb, var(--red) 30%, var(--bg));
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 1.4em; margin: 0 0 8px; color: var(--heading); }
  .controls { margin: 8px 0 12px; color: var(--muted); }
  .controls input { accent-color: var(--accent); }
  .wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  th { cursor: pointer; user-select: none; background: var(--surface); color: var(--accent); font-weight: 600; }
  th:hover { color: var(--fg); }
  th.sorted { color: var(--heading); }
  th.sorted::after { content: " \25B4"; }
  th.sorted.desc::after { content: " \25BE"; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:nth-child(even) { background: var(--stripe); }
  .num { text-align: right; font-variant-numeric: tabular-nums; width: 1%; }
  tr.binoc { background: var(--binoc) !important; }
  tr.nakedeye { background: var(--nakedeye) !important; }
  tr.spectacular { background: var(--spectacular) !important; }
  tr.archived { color: var(--muted); }
  a { color: var(--link); text-decoration-color: color-mix(in srgb, var(--link) 40%, transparent); }
  a:hover { text-decoration-color: currentColor; }
  .legend span { display: inline-block; padding: 0 6px; margin-right: 6px; border-radius: 3px; color: var(--fg); }
  #error { color: var(--error); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #themeToggle { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  #themeToggle button { font: inherit; color: var(--muted); background: var(--surface); border: none;
                        padding: 4px 10px; cursor: pointer; }
  #themeToggle button + button { border-left: 1px solid var(--border); }
  #themeToggle button:hover { color: var(--heading); }
  #themeToggle button[aria-pressed="true"] { color: var(--bg); background: var(--heading); cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Tracked Comets</h1>
  <div id="themeToggle" role="group" aria-label="Theme">
    <button type="button" data-theme="light">&#x2600; Light</button><button type="button" data-theme="dark">&#x263E; Dark</button>
  </div>
</header>
<div class="controls">
  <a href="comets.xml">RSS feed</a>
  &nbsp;·&nbsp;
  <label><input type="checkbox" id="showArchived"> Show archived</label>
  &nbsp;·&nbsp;
  <span class="legend">
    <span class="binoc" style="background:var(--binoc)">&le; 8 binoculars</span>
    <span style="background:var(--nakedeye)">&le; 6 naked eye</span>
    <span style="background:var(--spectacular)">&le; 2 spectacular</span>
  </span>
</div>
<p id="error"></p>
<div class="wrap">
  <table>
    <thead><tr id="head"></tr></thead>
    <tbody id="body"></tbody>
  </table>
</div>

<script>
// Thresholds mirror BINOC/NAKED_EYE/SPECTACULAR_MAGNITUDE in CometList.py
const BINOC = 8, NAKED_EYE = 6, SPECTACULAR = 2;
const CSV_PATH = 'known_comets.csv';

const columns = [
  { key: 'designation', label: 'Designation' },
  { key: 'permid', label: 'Perm ID' },
  { key: 'name', label: 'Name' },
  { key: 'discoverer', label: 'Discoverer' },
  { key: 'mag1davg', label: '1-day mag', num: true },
  { key: 'mag2davg', label: '2-day mag', num: true },
  { key: 'perihelion', label: 'Perihelion', date: true },
  { key: 'closeapproach', label: 'Closest approach', date: true },
  { key: 'closedist', label: 'Distance (AU)', num: true },
  { key: 'peakdate', label: 'Predicted peak', date: true },
  { key: 'peakmag', label: 'Peak mag', num: true },
  { key: 'lastobs', label: 'Last observation (UTC)' },
  { key: 'lastupdate', label: 'Last update (UTC)' },
];

let rows = [];
let sortKey = 'mag1davg', sortDesc = false;

function parseCsv(text) {
  const records = [];
  let field = '', record = [], quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') quoted = false;
      else field += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { record.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      record.push(field); field = '';
      if (record.some(f => f !== '')) records.push(record);
      record = [];
    } else field += c;
  }
  record.push(field);
  if (record.some(f => f !== '')) records.push(record);

  const [header, ...data] = records;
  return data.map(r => Object.fromEntries(header.map((h, i) => [h, r[i] ?? ''])));
}

function magClass(row) {
  const mag = parseFloat(row.mag1davg);
  if (isNaN(mag)) return '';
  if (mag <= SPECTACULAR) return 'spectacular';
  if (mag <= NAKED_EYE) return 'nakedeye';
  if (mag <= BINOC) return 'binoc';
  return '';
}

function compare(a, b, col) {
  if (col.num) {
    const x = parseFloat(a[col.key]), y = parseFloat(b[col.key]);
    if (isNaN(x)) return 1;
    if (isNaN(y)) return -1;
    return x - y;
  }
  return a[col.key].localeCompare(b[col.key]);
}

function render() {
  const head = document.getElementById('head');
  head.innerHTML = '';
  for (const col of columns) {
    const th = document.createElement('th');
    th.textContent = col.label;
    if (col.num) th.classList.add('num');
    if (col.key === sortKey) th.classList.add('sorted');
    if (col.key === sortKey && sortDesc) th.classList.add('desc');
    th.onclick = () => {
      sortDesc = col.key === sortKey ? !sortDesc : false;
      sortKey = col.key;
      render();
    };
    head.appendChild(th);
  }

  const showArchived = document.getElementById('showArchived').checked;
  const col = columns.find(c => c.key === sortKey);
  const visible = rows
    .filter(r => showArchived || r.archive !== 'True')
    .sort((a, b) => (sortDesc ? -1 : 1) * compare(a, b, col));

  const body = document.getElementById('body');
  body.innerHTML = '';
  for (const row of visible) {
    const tr = document.createElement('tr');
    tr.className = [magClass(row), row.archive === 'True' ? 'archived' : ''].join(' ').trim();
    for (const c of columns) {
      const td = document.createElement('td');
      if (c.num) td.className = 'num';
      if (c.key === 'designation') {
        const a = document.createElement('a');
        a.href = 'https://minorplanetcenter.net/db_search/show_object?object_id=' + encodeURIComponent(row.designation);
        a.textContent = row.designation;
        td.appendChild(a);
      } else if (c.date) {
        td.textContent = row[c.key].slice(0, 10);
      } else {
        td.textContent = row[c.key];
      }
      tr.appendChild(td);
    }
    body.appendChild(tr);
  }
}

document.getElementById('showArchived').onchange = render;

const themeToggle = document.getElementById('themeToggle');
const systemDark = window.matchMedia('(prefers-color-scheme: dark)');

function currentTheme() {
  return document.documentElement.dataset.theme || (systemDark.matches ? 'dark' : 'light');
}

function updateThemeToggle() {
  const theme = currentTheme();
  for (const b of themeToggle.querySelectorAll('button'))
    b.setAttribute('aria-pressed', b.dataset.theme === theme);
}

for (const b of themeToggle.querySelectorAll('button')) {
  b.onclick = () => {
    document.documentElement.dataset.theme = b.dataset.theme;
    try { localStorage.setItem('theme', b.dataset.theme); } catch (e) {}
    updateThemeToggle();
  };
}
systemDark.addEventListener('change', updateThemeToggle);
updateThemeToggle();

fetch(CSV_PATH, { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.text(); })
  .then(text => { rows = parseCsv(text); render(); })
  .catch(e => {
    document.getElementById('error').textContent =
      `Could not load ${CSV_PATH}: ${e.message}. The page must be served over HTTP next to the CSV.`;
  });
</script>
</body>
</html>
